<!DOCTYPE html>
<html lang="en">
 <head>

  <link rel="icon" type="image/png" href="logo.png">

 <body class="boot-active">
  <div class="noise">
  </div>
  <div class="cursor">
  </div>
  <div class="cursor-ring">
  </div>
  <div class="flash">
  </div>
  <section class="boot" id="boot">
   <div class="terminal">
    <div class="boot-stage number-stage" id="numberStage" aria-hidden="false">
     <form class="number-form" id="numberForm" autocomplete="off">
      <label for="accessNumber">TYPE A NUMBER TO ACCESS HOME PAGE</label>
      <div class="number-entry">
       <span class="prompt">&gt;</span>
       <input id="accessNumber" name="accessNumber" type="number" min="1" step="1" inputmode="numeric" required autofocus/>
       <button class="number-submit hoverable" type="submit">ENTER</button>
      </div>
      <p class="number-error" id="numberError" aria-live="polite"></p>
     </form>

     <div class="counter-panel" id="counterPanel" aria-live="polite">
      <p>HOME PAGE OPENING IN</p>
      <strong><span id="currentCount">0</span></strong>
     </div>
    </div>

   </div>
  </section>
  <section class="scene" id="scene">
   <canvas id="canvas">
   </canvas>
   <div class="giant" id="giant">
    PLAYER
   </div>
   <main class="main" id="main">
    <section class="identity">
     <div class="orbit">
     </div>
     <div class="name-wrap" id="nameWrap">

      <div class="tag">
       <span>
        Creative
       </span>
       <i>
       </i>
       <span>
        Perfectionist
       </span>
       <i>
       </i>
       <span>
        Gamer
       </span>
      </div>

       <span class="word one">
        Solaiman
       </span>
       <span class="word two">
        Shahria
       </span>
       <span class="word three">
        Shishir
       </span>
      </h1></div>
    </section>
    <footer class="bottom">
     <p class="footer-line">
      <span class="contact-label">Contact:</span>
      <a class="footer-email hoverable" href="mailto:contactsolaimanshahria@gmail.com">
       contactsolaimanshahria@gmail.com
      </a>
     </p>
    </footer>
   </main>
   <nav aria-label="Social links" class="socials">
    <a class="social hoverable" data-command="facebook" href="https://www.facebook.com/solaimanshahria" rel="noopener" target="_blank">
     <span>
      Facebook
     </span>
     <i class="fa-brands fa-facebook-f">
     </i>
    </a>
    <a class="social hoverable" data-command="instagram" href="https://instagram.com/solaimanshahria" rel="noopener" target="_blank">
     <span>
      Instagram
     </span>
     <i class="fa-brands fa-instagram">

    </a>
    <a class="social hoverable" data-command="x" href="https://x.com/xolaimanshahria" rel="noopener" target="_blank">
     <span>
      X / Twitter
     </span>
     <i class="fa-brands fa-x-twitter">
     </i>
    </a>
    <a class="social hoverable" data-command="discord" href="https://discord.gg/nBTr3dPHGM" rel="noopener" target="_blank">
     <span>
      Discord
     </span>
     <i class="fa-brands fa-discord">

    <a class="social hoverable" data-command="website" href="https://playboyshishir.com" rel="noopener" target="_blank">
     <span>
      Website
     </span>
     <i class="fa-solid fa-globe">
     </i>
